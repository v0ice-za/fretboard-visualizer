server:
  # Railway assigns a dynamic port via $PORT; Spring must bind to it or the health
  # check never passes and the deploy is marked crashed. Locally $PORT is unset → 8080.
  port: ${PORT:8080}

spring:
  application:
    name: guitar-app
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/guitarapp}
    username: ${DATABASE_USERNAME:guitarapp}
    password: ${DATABASE_PASSWORD:guitarapp_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # Dev-only default (256-bit base64). Real secret comes from JWT_SECRET env (Railway) — see Story 3.7.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTI1Ni1iaXQ=}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  google:
    # OAuth 2.0 Web client ID (Google Cloud Console → Credentials). No dev fallback — must be set explicitly.
    client-id: ${GOOGLE_CLIENT_ID}
  cors:
    # Comma-separated allow-list (allowCredentials forbids '*'). Dev = Vite origin;
    # prod Vercel origin set via CORS_ALLOWED_ORIGINS in Railway (Story 3.7).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  cookie:
    # Refresh-cookie attributes. Dev default Lax+insecure (http localhost via Vite proxy);
    # prod sets COOKIE_SAME_SITE=None / COOKIE_SECURE=true for cross-origin (Story 3.7).
    same-site: ${COOKIE_SAME_SITE:Lax}
    secure: ${COOKIE_SECURE:false}
  stripe:
    # No dev fallback — real Stripe test/live keys must be set explicitly (Story 3.5).
    secret-key: ${STRIPE_SECRET_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
    price-id: ${STRIPE_PRICE_ID}
  frontend:
    # Origin used to build Stripe Checkout success/cancel redirect URLs.
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  ratelimit:
    # Trusted reverse-proxy hops that append to X-Forwarded-For (Railway edge = 1). The
    # rate-limit key uses the IP this many entries from the right — the client cannot spoof it.
    # Verify against Railway's real topology at deploy and tune via RATELIMIT_TRUSTED_PROXY_COUNT.
    trusted-proxy-count: ${RATELIMIT_TRUSTED_PROXY_COUNT:1}
