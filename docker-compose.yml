services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: guitarapp
      POSTGRES_USER: guitarapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guitarapp_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guitarapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/guitarapp
      DATABASE_USERNAME: guitarapp
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-guitarapp_dev}
    # Restart on crash (e.g. a failed Flyway migration exits the JVM) instead of leaving a
    # silently-dead container; the healthcheck surfaces readiness via the actuator-free
    # /api/v1/health endpoint. wget is provided by the JRE Alpine (BusyBox) base image.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  postgres_data:
