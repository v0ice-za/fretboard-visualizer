rd tab and In-Key tab must not leave a stale root — same bug class as 4.4/4.5 reviews) + a test for it. UI = new free 'In Key' tab in LibraryPanel (harmony UI home per epics.distillate). Gating confirmed FREE per distillate. 2 open questions flagged for pickup (half-dim option A/B; tab label). Prior 2026-09-15 (4.5 code review complete → done: 3-layer parallel review (Blind Hunter / Edge Case Hunter / Acceptance Auditor). Auditor confirmed 0 AC violations across all 8 ACs. 13 raw findings triaged to 4 real patches (all applied) + 1 false positive corrected + 5 dismissed. Patches: hardened themeStore against THROWING localStorage (Safari private mode / sandboxed iframes / blocked site-data raise on getItem/setItem, not just return null — would have crashed module load or a theme switch), added an exported isValidTheme guard and narrowed readStoredTheme() to Theme|null so a corrupted/stale stored value can never reach setTheme (also let useThemeGuard drop two unchecked `as Theme` casts), plus regression tests for undefined-paywall-callback / rapid successive selections / corrupted-storage. The one HIGH finding ("hasRestoredRef not reset on logout → cross-account theme leak") was a FALSE POSITIVE — the shipped code already resets it at useThemeGuard.ts:60 and an existing test (restore-after-downgrade) proves it; the Blind Hunter flagged it off the prose summary it was handed, not the source. 383/383 frontend tests green (+20 over the 363 at implementation), type-check clean, lint clean, build succeeds. Epic 4 now 4.1-4.5 all done → epic-4 retrospective (ER) available. Prior 2026-09-15 (4.5 implemented → review: premium theme picker (Account sheet, dark/light free + neon/mono/vibrant/minimal premium-gated with lock+paywall), useThemeGuard entitlement restore/fallback mirroring 4.4's auth-transition-ref pattern (collapsed to one combined isEntitled ref instead of two separate ones), FretDot.tsx rewired from hardcoded hex to genuinely theme-driven CSS vars (discovered --color-dot-mode-root didn't even exist as a token before this story — added it, plus 4 missing --dot-text-* vars). WCAG + colour-blind audit done with real computation, not eyeballing: wrote a script mirroring FretDot.test.tsx's exact contrast algorithm plus a protanopia/deuteranopia simulation matrix to choose every new theme's dot palette BEFORE writing CSS — caught a real problem (minimal theme's seed mode colour, inherited from the old pre-Aurora UX spec, was only 18.8-28.2 units from root under colour-blind simulation; fixed by moving mode to dark green, clears 84+ from both root/scale). Separately, live-loading the app in Chrome (not just running vitest) caught a real CSS bug the automated suite couldn't have caught: a comment containing a literal `*/` substring closed a CSS comment early and broke the whole app — fixed, then visually confirmed all 4 new themes render correctly (dots, note-name text, chrome) via live screenshots. 363/363 frontend tests green (+62 new: themeStore/ThemePicker/useThemeGuard suites + expanded FretDot contrast coverage), type-check clean, lint clean, build succeeds. Epic 4 still in-progress pending this review. Prior 2026-09-15 (4.5 story created → ready-for-dev: premium theme picker (dark/light free, neon/mono/vibrant/minimal premium) + WCAG contrast audit. Source docs (epics/ux-spec) predate two things that already shipped and had to be reconciled: (1) a free dark/light toggle already exists (themeStore.ts, quick-dev 2026-09-01) that the original single-free-theme spec never anticipated — extending it, not building a parallel mechanism; (2) Story 5.5's dot retune left FretDot.tsx's DOT_CONFIG hardcoding one fixed hex palette in JS with the `--color-dot-*` CSS tokens confirmed DEAD (5.5's own review flagged this) — this story is what finally wires them live so dots can vary per theme. Key decisions baked into the story: dark-class-family toggling (`.dark` class must apply to neon/mono/vibrant too, since existing `dark:` Tailwind utilities key off the class not `data-theme` — easy to half-implement and not notice); entitlement-resolution sequencing for premium-theme restore/fallback mirrors 4.4's exact auth/premium async-sequencing fix (previous-value ref, only act on a genuine true→false transition, `getInitialTheme()`'s synchronous read stays narrowed to dark/light-only so a premium theme can never flash before entitlement resolves); opacity stays a fixed per-state JS constant across all 6 themes (only fill/text hue vary via CSS var) — deliberately not reopening the per-theme-opacity axis 5.5's review showed is easy to get contrast-math wrong on, twice. Seed hex values for the 4 new themes pulled from ux-design-specification.md's premium token-override section; freeform/mode-root have no seed (didn't exist when that section was written) and are flagged for the audit task to originate. Epic 4 stays in-progress (4.1-4.4 done, 4.5 now ready-for-dev). Prior 2026-09-14 (4.4 code review complete → done: 3-layer parallel review on a cleanly-scoped diff found a SEVERE bug — cross-account session leak: logging out and a different user logging in on the same tab silently overwrote the second user's saved session with the first user's stale data, because the restore/autosave guard refs never reset. Fixed by resetting refs + the fretboard fields themselves on a genuine auth true→false transition (took 2 attempts — first fix wrongly fired on "currently unauthenticated" which also hits on mount for anonymous/free users, caught by a new test before shipping). Also found the dev's own design docs were factually wrong: claimed capoPosition/freeformMarks "aren't URL-addressable" but useUrlState.ts hydrates both from ?capo=/?marks=, so shared links with those params got silently clobbered by restore — fixed by gating all 3 fields individually, not just tuning. Fixed 2 more real race conditions: in-flight user edits during the restore fetch could be silently dropped, and every successful restore fired a redundant follow-up autosave re-saving the same data. Added a missing @Size validation. 2 items deferred (concurrent-upsert unique-constraint race; SessionStateDto-as-persisted-JSON-shape coupling). 137/137 backend + 301/301 frontend tests green (test count grew from 6→12 on the frontend hook alone). Epic 4 now 4.1-4.4 done, only 4.5 (Premium Themes) remains in backlog. Prior 2026-09-14 (4.4 implemented → review: full-stack session persistence — backend GET/POST/DELETE /api/v1/sessions (SessionController/Service/Repository/Exception mirroring 4.1/4.2's TuningController pattern exactly), upsert-per-user saved_sessions table (V7, corrected from the stale "V4" in source docs), frontend useSessionSync hook (debounced autosave + URL-precedence-aware restore). KEY IMPLEMENTATION FIX: switched the URL-snapshot capture from a module-level const (as drafted in the story) to a lazy useState initializer — same "before any effect" correctness guarantee, but avoids a real test-isolation bug where vi.resetModules() to test different URLs also silently re-created the mocked apiClient (vi.mock factory re-runs), decoupling test assertions from the mock the hook actually called. Also self-caught and removed dead branching that gated capoPosition/freeformMarks restore on ?key=/?scale= URL params that were never actually relevant (those fields aren't URL-addressable; only ?tuning= matters). Found a real test-infra gap beyond the story's task list: WebMockTestBase + GuitarAppApplicationTests both need every JPA repo the Spring context depends on mocked — GuitarAppApplicationTests.contextLoads() failed on NoSuchBeanDefinitionException for SavedSessionRepository until both were updated. Regression: backend 136/136, frontend 295/295, type-check clean, lint clean. Prior 2026-09-14 (4.4 story created → ready-for-dev: full-stack session-persistence slice, closely mirrors 4.1/4.2's custom-tunings pattern (TuningController/Service/Repository/Exception). Two significant corrections to the source docs baked into the story: (1) epics/architecture both say migration "V4__create_saved_sessions.sql" but V4 is already taken (add_user_token_version, from 3.x auth work) — actual next migration is **V7**; (2) architecture's API surface lists `DELETE /api/v1/sessions/{id}` which the epics AC list never mentioned — included anyway since architecture is the authoritative route surface. Also resolved two real implementation-ambiguities before they could become bugs: (a) upsert-vs-history — FR12 says "history" and architecture's DELETE endpoint hints at multi-row, but no ACs describe a history UI and debounced autosave would balloon a per-save-row table fast, so decided **one row per user, UNIQUE(user_id), POST upserts**; (b) URL-precedence sequencing — `useUrlState` unconditionally writes tuning/key/scale defaults into the URL within one effect-flush of mount, so a restore hook checking the *live* URL would always see them present and silently never restore a session; story mandates capturing a module-level `URLSearchParams` snapshot at import time (before any effect runs) as the only correct way to detect the user's *actual* incoming URL. No new frontend dependencies (hand-rolled debounce, explicitly forbidding a library add). Epic 4 was already in-progress so no epic-status flip needed. Prior 2026-09-14 (5.5 code review complete → done: 3-layer parallel review found and fixed a real WCAG AA failure the original guardrail test missed — the test checked nominal fill vs text, but `scale` renders at 0.85 opacity and alpha-composites with the board, and the true composited dark-theme contrast was ~3.68:1 (fails); fixed via a new theme-aware `--dot-text-scale` CSS var (dark/light need opposite text polarity, confirmed no single static color works). Also fixed a `scale`/`mode-root` violet-hue collision independently flagged by all 3 review layers (mode-root shifted to fuchsia `#d946ef`), extended the colour-blind audit to protanopia + freeform (previously only deuteranopia + root/scale/mode), corrected inaccurate contrast-ratio comments, consolidated redundant CSS, fixed a stale color-name comment. 2 items deferred (dead `--color-dot-*` tokens; motion-duration spec/implementation mismatch, both pre-existing/out-of-scope). AC5 cross-browser gap (Chrome-only) resolved as a documented judgment call, not silently claimed complete. 289/289 tests green (10 new composited-contrast assertions), type-check clean, lint clean. Epic 5 now **fully done (5/5)** — retrospective (ER) available next. Prior 2026-09-14 (5.5 implemented → review: dot Aurora retune (Option B) — root #fbbf24 gold, scale #8b5cf6 violet, mode #22d3ee cyan, freeform #f0abfc pink. KEY FINDING: the `--color-dot-*` CSS tokens in index.css are DEAD code (never referenced); real render source is FretDot.tsx DOT_CONFIG hardcoded hex — story's "index.css token-only, no component changes" premise was wrong, so the retune landed in FretDot.tsx and the index.css tokens were synced as intent only. AC2 fix: old white scale-dot text FAILS WCAG AA on the new violet (4.23:1, and was already borderline 4.47:1 on old indigo) → moved scale text to near-black (~4.73:1); added a WCAG-AA contrast guardrail test suite to FretDot.test.tsx. AC4 gap fixed: only .fret-dot was reduced-motion-gated → added app-wide prefers-reduced-motion universal rule (hover-lift/glow/sliding-tab/sheets). Colour-blind (deuteranopia sim) + Chrome dark/light live-verified. 4 deferred findings flagged (wire dead dot tokens→theme-aware dots; light-theme gold/cyan dot-vs-board ~1.5:1; capo stroke still old amber; mode-root shares violet family). Regression: 284/284 tests green, type-check clean, lint clean. Epic 5 now 5/5 stories done pending this review → epic ready for retrospective. Prior 2026-09-10 (5.4 code review complete → done: 3-layer review caught a real gap — LibraryPanel's mobile sheet (the explicit "6th" AC2 target) never got the spacing rhythm the other 5 sheets share. 3 patches applied: aligned that header with the d